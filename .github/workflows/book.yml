name: deploy-book

# Deploy when main changes; on pull requests, build only (see the guard on the
# deploy step below) so a PR is checked without touching the live site.
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

# This job installs dependencies, build the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    # v2
    - uses: actions/checkout@v4

    # Install dependencies
    - name: Set up Python
      # v1
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pwd
        ls
        pip install -r book/requirements.txt
    # Build the book
    - name: Build the book
      run: |
        jupyter-book build book/
    # Push the book's HTML to github-pages.
    # Guarded: without this, opening a pull request would publish that branch
    # to the live site.
    - name: Push to github-pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      # v3.6.1
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./book/_build/html